<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣麻將</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--fg:#222;--felt:#1d5c3a;--tile:#f6f7f1;--panel:#14432a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--fg:#eee}}
:root[data-theme="dark"]{--bg:#15191a;--fg:#eee}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:8px}
#t{max-width:820px;margin:auto;background:var(--felt);border-radius:14px;padding:8px;color:#fff;display:grid;grid-template-columns:104px 1fr 104px;--av:84px;gap:6px;position:relative;overflow:hidden}
.pl{background:var(--panel);border-radius:8px;padding:5px;font-size:12px;min-height:56px}
#p2,#bar,#me{grid-column:1/4}#p3{grid-column:1;grid-row:2}#c{grid-column:2;grid-row:2}#p1{grid-column:3;grid-row:2}
#c{display:grid;grid-template-columns:1fr 1.3fr 1fr;grid-template-areas:". a ." "b m d" ". e .";gap:4px;font-size:11px;background:#0b2f1c;border-radius:8px;padding:4px;align-items:center}
#c>div{min-height:30px}#d2{grid-area:a}#d3{grid-area:b}#d1{grid-area:d}#d0{grid-area:e}#mid{grid-area:m;text-align:center;font-size:12px;line-height:1.5}
.tl{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:26px;height:36px;margin:1px;border-radius:4px;background:var(--tile);color:#222;font-size:14px;line-height:1.1;box-shadow:0 2px 0 #8d9a90;vertical-align:middle}
.tl i{font-style:normal;font-size:11px;color:#b22}.tl b{font-weight:600}
.s1 b{color:#1a4fa0}.s2 b{color:#1c7a3a}.hr b{color:#b22}.hg b{color:#1c7a3a}
.tl.xs,#me .tl.xs{width:17px;height:24px;font-size:12px;margin:1px;cursor:default;transform:none}.xs i{font-size:9px}
.bk{background:linear-gradient(145deg,#1d6b3d,#0f3d22);box-shadow:0 2px 0 #06210f,inset 0 0 0 1.5px #5fae80}.hl{outline:2px solid #f2c14e}
#me .tl{width:36px;height:50px;font-size:20px;cursor:pointer;margin:2px 1px}#me .tl i{font-size:13px}
#me .tl:hover{transform:translateY(-6px)}.gap{display:inline-block;width:14px}
@keyframes pop{from{opacity:0;transform:translateY(-20px) scale(.7)}}
.dl .tl{animation:pop .3s both}
@keyframes sh{50%{transform:translate(var(--x),var(--y)) rotate(var(--r))}}
#shuf{position:fixed;inset:0;overflow:auto;padding:12px;background:#000a;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px}
#sb{position:relative;width:240px;height:150px}
#sb .tl{position:absolute;left:calc(50% - 13px);top:calc(50% - 18px);animation:sh .5s ease-in-out infinite}
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:6px}
@media(max-width:480px){.ws{width:6px;height:9px}}
.tl svg{width:88%;height:92%;display:block}.tl i.bai{width:62%;height:68%;border:2px solid #1a4fa0;border-radius:3px;background:none}
.fw b{font-size:13px;line-height:1}.fw i{font-size:8px;color:#667}
#mid .big{font-size:24px;font-weight:700;color:#f2d98a;letter-spacing:2px}#mid .mid2{font-size:18px;font-weight:700;margin-top:2px}
.wl{position:absolute;display:flex;gap:1px;justify-content:center}
.wb{left:18px;right:18px;bottom:3px}.wt{left:18px;right:18px;top:3px}
.wr,.wf{top:18px;bottom:18px;flex-direction:column;align-items:center}.wr{right:3px}.wf{left:3px}
.ws{width:10px;height:13px;border-radius:2px;background:linear-gradient(#e8efe9 30%,#14532d 30%);box-shadow:0 1px 0 #06210f,inset 0 0 0 1px #5fae80}.ws.off{visibility:hidden}
@media(max-width:480px){#mid .big{font-size:16px;letter-spacing:0}#mid .mid2{font-size:12px}}
#dbox{width:min(92%,340px);padding:18px 14px;border-radius:16px;border:2px solid #d9b45a;background:radial-gradient(circle at 50% 30%,#2a7a4e,#124d2d);box-shadow:0 10px 30px #000a,inset 0 0 30px #0006;text-align:center}
#dbox h2{margin:0 0 4px;font-size:24px;letter-spacing:6px;color:#f2d98a}
#dbox p{margin:0;font-size:13px;opacity:.85}
#dice{display:flex;justify-content:center;gap:14px;margin:16px 0 8px;min-height:72px;align-items:center}
.die{width:60px;height:60px;border-radius:12px;background:linear-gradient(145deg,#fff,#ddd6c0);box-shadow:0 5px 0 #aaa28a,0 9px 12px #0006;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;place-items:center}
.die i{width:11px;height:11px;border-radius:50%}.die i.on{background:#222;box-shadow:inset 0 -2px 2px #0006}.die.r i.on{background:#c62828}
.die.rolling{animation:tum .35s linear infinite}.die.land{animation:lnd .45s ease-out}
@keyframes tum{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes lnd{0%{transform:translateY(-26px) rotate(-25deg)}60%{transform:translateY(4px) rotate(6deg)}100%{transform:none}}
#seats{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:'. a .' 'b c d' '. e .';gap:6px;width:250px;margin:12px auto}
.seat{padding:7px 4px;border-radius:10px;background:#0007;font-size:14px;transition:.12s}
.seat.hot{background:#f2c14e;color:#222;transform:scale(1.12)}.seat.dealer{background:#e0a21a;color:#222;box-shadow:0 0 16px #ffd76a;transform:scale(1.15);font-weight:700}
#sc{grid-area:c;align-self:center;font-size:28px;font-weight:700;color:#f2d98a}
#dres{min-height:1.5em;margin:8px 0}
.av{display:inline-block;width:var(--av,30px);height:var(--av,30px);border-radius:50%;object-fit:cover;background:#0b2f1c;text-align:center;line-height:var(--av,30px);font-size:calc(var(--av,30px)*.6);vertical-align:middle;margin-right:4px}
button{font:inherit;padding:8px 14px;margin:4px 4px 0 0;border:0;border-radius:8px;background:#f2c14e;color:#222;cursor:pointer}
#msg{min-height:1.5em;font-size:15px}
#res{white-space:pre-line;background:#0008;padding:8px;border-radius:8px;grid-column:1/4}#res:empty{display:none}
@media(max-width:480px){#t{grid-template-columns:70px 1fr 70px;--av:52px}#me .tl{width:27px;height:40px;font-size:16px}}
</style></head><body>
<div id="t">
<div class="pl" id="p2"></div><div class="pl" id="p3"></div><div id="c"></div><div class="pl" id="p1"></div>
<div id="bar"><div id="msg"></div><div id="act"></div></div>
<div class="pl" id="me"></div><div id="res"></div>
</div>
<script>
const NMS=["劉知珉(你)","內永枝利","金旼炡","寧藝卓"],WD="東南西北",FL="春夏秋冬梅蘭竹菊",BASE=30,UNIT=10;
let W,H,M,F,D,turn,pend,canW,last,over,opts,aw,dealer=0,d0=0,streak=0,quan=0,S=[1000,1000,1000,1000],ks=0,dr=0,dealing=0;
const $=id=>document.getElementById(id);
const NM2=t=>t<27?"一二三四五六七八九"[t%9]+"萬筒條"[t/9|0]:"東南西北中發白"[t-27];
const PL={1:[[15,20]],2:[[15,11],[15,29]],3:[[8,9],[15,20],[22,31]],4:[[8,11],[22,11],[8,29],[22,29]],5:[[8,11],[22,11],[15,20],[8,29],[22,29]],6:[[8,9],[22,9],[8,20],[22,20],[8,31],[22,31]],7:[[8,7],[15,13],[22,19],[8,28],[22,28],[8,36],[22,36]],8:[[8,6],[22,6],[8,16],[22,16],[8,25],[22,25],[8,34],[22,34]],9:[[8,9],[15,9],[22,9],[8,20],[15,20],[22,20],[8,31],[15,31],[22,31]]};
const BL={2:[[15,11],[15,29]],3:[[15,11],[8,29],[22,29]],4:[[8,11],[22,11],[8,29],[22,29]],5:[[8,11],[22,11],[15,20],[8,29],[22,29]],6:[[8,11],[15,11],[22,11],[8,29],[15,29],[22,29]],7:[[15,8],[8,20],[15,20],[22,20],[8,32],[15,32],[22,32]],8:[[8,8],[22,8],[8,17],[22,17],[8,25],[22,25],[8,34],[22,34]],9:PL[9]};
function tile(t,cls="",ex=""){
  const s=t/9|0,n=t%9+1;
  if(t==33)return `<span ${ex} class="tl ${cls}"><i class="bai"></i></span>`;
  if(s==0||t>=27)return tileOld(t,cls,ex);
  let g='';
  if(s==1)PL[n].forEach(([x,y],i)=>{const r=n==1?9:n>6?3.3:4.2,c=n==1?'#c62828':['#1c7a3a','#c62828','#1a4fa0'][i%3];
    g+=`<circle cx='${x}' cy='${y}' r='${r}' fill='${c}' stroke='#123' stroke-width='.6'/><circle cx='${x}' cy='${y}' r='${r*.45}' fill='#fff9'/>`});
  else if(n==1)g=`<text x='15' y='28' font-size='24' text-anchor='middle'>🦚</text>`;
  else{const h=n<7?12:n==8?7:10;BL[n].forEach(([x,y],i)=>{const c=(n==5&&i==2)||(n==7&&i==0)?'#c62828':'#1c7a3a';
    g+=`<rect x='${x-2.2}' y='${y-h/2}' width='4.4' height='${h}' rx='2' fill='${c}'/><rect x='${x-2.2}' y='${y-.7}' width='4.4' height='1.4' fill='#fff8'/>`})}
  return `<span ${ex} class="tl ${cls}"><svg viewBox='0 0 30 40'>${g}</svg></span>`;
}
function tileOld(t,cls="",ex=""){
  if(t<27)return `<span ${ex} class="tl s${t/9|0} ${cls}"><b>${"一二三四五六七八九"[t%9]}</b><i>${"萬筒條"[t/9|0]}</i></span>`;
  return `<span ${ex} class="tl ${t==31?"hr":t==32?"hg":""} ${cls}"><b>${"東南西北中發白"[t-27]}</b></span>`;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
function draw(p,front){
  for(;;){const t=front?W.shift():W.pop();
    if(t>=34){F[p].push(t);continue}
    H[p].sort((a,b)=>a-b);H[p].push(t);return t}
}
function start(){
  over=false;$("res").textContent="";$("act").innerHTML="";$("msg").textContent="洗牌中…";
  H=[[],[],[],[]];M=[[],[],[],[]];F=[[],[],[],[]];D=[[],[],[],[]];W=[];last=null;pend=null;turn=-1;
  render();
  const s=document.createElement("div");s.id="shuf";let h="";
  for(let i=0;i<40;i++)h+=`<span class="tl bk" style="--x:${(Math.random()-.5)*220|0}px;--y:${(Math.random()-.5)*130|0}px;--r:${(Math.random()-.5)*200|0}deg;animation-delay:${i*25}ms"></span>`;
  s.innerHTML=`<div id="sb">${h}</div><div>洗牌中…</div>`;$("t").appendChild(s);
  setTimeout(()=>{s.remove();deal()},1600);
}
function deal(){
  for(let t=0;t<34;t++)for(let k=0;k<4;k++)W.push(t);
  for(let t=34;t<42;t++)W.push(t);shuffle(W);
  for(let r=0;r<16;r++)for(let p=0;p<4;p++)draw(p);
  H.forEach(h=>h.sort((a,b)=>a-b));
  dealing=1;setTimeout(()=>dealing=0,1000);turnOf(dealer);
}
function solve(c,p,tri){
  const i=c.findIndex(x=>x>0);if(i<0)return p;
  let r=false;
  if(c[i]>=3){c[i]-=3;r=solve(c,p,tri);c[i]+=3;if(r)return true}
  if(!p&&c[i]>=2){c[i]-=2;r=solve(c,1,tri);c[i]+=2;if(r)return true}
  if(!tri&&i<27&&i%9<7&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;r=solve(c,p,tri);c[i]++;c[i+1]++;c[i+2]++;if(r)return true}
  return false;
}
const cnt=a=>{const c=Array(34).fill(0);a.forEach(t=>c[t]++);return c};
const isWin=(a,tri)=>solve(cnt(a),0,tri);
function ownKongs(p){
  const c=cnt(H[p]),r=[];
  for(let t=0;t<34;t++){
    if(c[t]==4)r.push({t,add:0});
    else if(c[t]&&M[p].some(m=>m.length==3&&m[0]==m[1]&&m[0]==t))r.push({t,add:1})}
  return r;
}
function turnOf(p,skip){
  turn=p;canW=false;
  if(!skip){ks=0;if(W.length<=16)return end();draw(p);dr=1;return after(p)}
  dr=0;go(p);
}
function after(p){
  canW=false;
  if(isWin(H[p])){if(p)return win(p,1);canW=true}
  else if(p){const k=ownKongs(p)[0];if(k&&Math.random()<.6)return setTimeout(()=>doKong(p,k.t,k.add),500)}
  go(p);
}
function go(p){
  if(p==0){pend="discard";render()}
  else{pend=null;render();setTimeout(()=>aiDiscard(p),650)}
}
function doKong(p,t,add,from){
  const rm=n=>{while(n--)H[p].splice(H[p].indexOf(t),1)};
  if(add){rm(1);M[p].find(m=>m.length==3&&m[0]==m[1]&&m[0]==t).push(t)}
  else if(from!=null){rm(3);D[from].pop();const m=[t,t,t,t];m.o=1;M[p].push(m)}
  else{rm(4);M[p].push([t,t,t,t])}
  pend=null;
  if(W.length<=16)return end();
  turn=p;draw(p,1);dr=1;ks=1;after(p);
}
function aiDiscard(p){
  const c=cnt(H[p]);let best=0,bs=99;
  H[p].forEach((t,i)=>{
    let s=c[t]*3;
    if(t<27){const k=t%9;
      if(k>0&&c[t-1])s+=2;if(k<8&&c[t+1])s+=2;
      if(k>1&&c[t-2])s+=1;if(k<7&&c[t+2])s+=1;
      if(k==0||k==8)s-=1}
    else if(c[t]==1)s-=2;
    s+=Math.random();
    if(s<bs){bs=s;best=i}
  });
  discard(p,best);
}
function discard(p,i){
  const t=H[p].splice(i,1)[0];
  H[p].sort((a,b)=>a-b);D[p].push(t);last={p,t};pend=null;dr=0;
  let hW=0;aw=0;
  for(let k=1;k<4;k++){const q=(p+k)%4;
    if(isWin([...H[q],t])){if(q==0)hW=1;else if(!aw)aw=q}}
  const c=cnt(H[0]);opts={win:hW,pong:p!=0&&c[t]>=2,kong:p!=0&&c[t]==3,chows:[]};
  if(p==3&&t<27){const k=t%9;
    [[-2,-1],[-1,1],[1,2]].forEach(([a,b])=>{if(k+a>=0&&k+b<=8&&c[t+a]&&c[t+b])opts.chows.push([t+a,t+b])})}
  if(opts.win||opts.pong||opts.kong||opts.chows.length){pend="react";render();return}
  render();
  if(aw)return win(aw,0,t);
  for(let k=1;k<4;k++){const q=(p+k)%4;if(!q)continue;const n=cnt(H[q])[t];
    if(n==3&&Math.random()<.5)return doKong(q,t,0,p);
    if(n>=2&&Math.random()<.35)return meld(q,t,p)}
  next(p);
}
function next(p){setTimeout(()=>turnOf((p+1)%4),350)}
function meld(q,t,from,pair){
  const need=pair||[t,t];
  need.forEach(x=>H[q].splice(H[q].indexOf(x),1));
  D[from].pop();const m=[...need,t].sort((a,b)=>a-b);m.o=1;M[q].push(m);
  H[q].sort((a,b)=>a-b);turn=q;dr=0;canW=false;pend=null;go(q);
}
function act(a,j){
  const t=last.t,f=last.p;pend=null;
  if(a=="win")return win(0,0,t);
  if(a=="pong")return meld(0,t,f);
  if(a=="kong")return doKong(0,t,0,f);
  if(a=="chow")return meld(0,t,f,opts.chows[j]);
  if(aw)return win(aw,0,t);
  render();next(f);
}
function tai(p,ts){
  const all=[...H[p],...M[p].flat()],c=cnt(all),L=[],s=(p-dealer+4)%4;
  if(p==dealer){L.push(["莊家",1]);if(streak)L.push([`連${streak}拉${streak}`,2*streak])}
  if(ts)L.push(["自摸",1]);
  if(ts&&ks)L.push(["槓上開花",1]);
  if(M[p].every(m=>!m.o))L.push(["門清",1]);
  const f=F[p].filter(x=>(x-34)%4==s).length;if(f)L.push(["花牌",f]);
  [31,32,33].forEach(t=>{if(c[t]>=3)L.push(["三元牌 "+NM2(t),1])});
  if(c[27+quan]>=3)L.push(["圈風 "+WD[quan],1]);
  if(c[27+s]>=3)L.push(["門風 "+WD[s],1]);
  if(isWin(H[p],1)&&M[p].every(m=>m[0]==m[1]))L.push(["碰碰胡",4]);
  const su=new Set(all.filter(t=>t<27).map(t=>t/9|0)),h=all.some(t=>t>=27);
  if(su.size==1)L.push([h?"混一色":"清一色",h?4:8]);
  return L;
}
function win(p,ts,t){
  if(t!=null){H[p].push(t);D[last.p].pop()}
  H[p].sort((a,b)=>a-b);
  const L=tai(p,ts),n=L.reduce((s,x)=>s+x[1],0),amt=BASE+n*UNIT;
  if(ts){for(let q=0;q<4;q++)if(q!=p){S[q]-=amt;S[p]+=amt}}
  else{S[last.p]-=amt;S[p]+=amt}
  const ds=p==dealer;
  if(ds)streak++;else{dealer=(dealer+1)%4;streak=0;if(dealer==d0)quan=(quan+1)%4}
  over=true;pend=null;render();
  $("msg").textContent=`${NMS[p]}${ts?"自摸":"胡牌"}！`;
  $("res").textContent=`🀄 ${NMS[p]}${ts?"自摸":"胡了"}，共 ${n} 台（底 ${BASE} + ${n}×${UNIT} = ${amt}）\n`+L.map(x=>`${x[0]} ${x[1]}台`).join("、")+
    (ts?`\n三家各付 ${amt}`:`\n放槍：${NMS[last.p]} 付 ${amt}`)+`\n${ds?"莊家連莊":"輪莊："+NMS[dealer]+"當莊"}`;
  $("act").innerHTML=`<button onclick="start()">下一局</button>`;
}
function end(){
  streak++;over=true;pend=null;render();
  $("msg").textContent="流局";$("res").textContent="牌牆摸完，流局，莊家連莊。";
  $("act").innerHTML=`<button onclick="start()">下一局</button>`;
}
const FE=["🌱","☀️","🍂","❄️","🌸","🌷","🎋","🌼"];
const fl=p=>F[p].map(t=>`<span class="tl xs fw"><b>${FE[t-34]}</b><i>${FL[t-34]}</i></span>`).join("");
const mt=p=>M[p].map(m=>m.map(t=>tile(t,"xs")).join("")).join(" ");
function side(p){
  const w=WD[(p-dealer+4)%4];
  return `${av(p)}<b>${NMS[p]}</b> ${w}${p==dealer?"莊":""}${turn==p&&!over?" ▶":""}<br>${S[p]}分<br>`+
    (over?H[p].map(t=>tile(t,"xs")).join(""):`<span class="tl bk xs"></span>×${H[p].length}`)+"<br>"+mt(p)+" "+fl(p);
}
const dc=p=>D[p].map((t,i)=>tile(t,"xs"+(last&&last.p==p&&i==D[p].length-1&&!over?" hl":""))).join("");
function wall(){
  const n=W?Math.ceil(Math.max(0,W.length-16)/2):0;let h='';
  for(let i=0;i<n;i++)h+="<i class='ws'></i>";return h;
}
function wallOld(){
  const n=W?Math.ceil(Math.max(0,W.length-16)/2):0;
  const sd=k=>{let h='';for(let i=0;i<10;i++)h+=`<i class='ws${k*10+i<n?'':' off'}'></i>`;return h};
  return `<div class='wl wb'>${sd(0)}</div><div class='wl wr'>${sd(1)}</div><div class='wl wt'>${sd(2)}</div><div class='wl wf'>${sd(3)}</div>`;
}
function render(){
  $("p1").innerHTML=side(1);$("p2").innerHTML=side(2);$("p3").innerHTML=side(3);
  $("c").innerHTML=`<div id="d2">${dc(2)}</div><div id="d3">${dc(3)}</div><div id="mid"><div class="big">${WD[quan]}風圈</div><div class="mid2">莊：${NMS[dealer]}${streak?" 連"+streak:""}</div><div class="wall">${wall()}</div></div><div id="d1">${dc(1)}</div><div id="d0">${dc(0)}</div>`;
  const h=H[0];$("me").className="pl"+(dealing?" dl":"");
  $("me").innerHTML=`${av(0)}<b>${NMS[0]}</b> ${WD[(0-dealer+4)%4]}${dealer==0?"莊":""}${turn==0&&!over?" ▶":""} ${S[0]}分　${mt(0)} ${fl(0)}<br>`+
    h.map((t,i)=>(dr&&turn==0&&pend=="discard"&&i==h.length-1?`<span class="gap"></span>`:"")+tile(t,"",`onclick="pick(${i})" style="animation-delay:${dealing?i*35:0}ms"`)).join("");
  if(over||turn<0)return;
  let a="",m="對手思考中…";
  if(pend=="discard"){
    m=canW?"你可以自摸！或選一張牌打出":"請選一張牌打出";
    if(canW)a=`<button onclick="win(0,1)">自摸</button>`;
    if(dr)a+=ownKongs(0).map(k=>`<button onclick="doKong(0,${k.t},${k.add})">${k.add?"加槓":"槓"} ${NM2(k.t)}</button>`).join("");
  }else if(pend=="react"){
    m=`${NMS[last.p]}打出「${NM2(last.t)}」`;
    a=(opts.win?`<button onclick="act('win')">胡</button>`:"")+(opts.kong?`<button onclick="act('kong')">槓</button>`:"")+(opts.pong?`<button onclick="act('pong')">碰</button>`:"")+
      opts.chows.map((c,j)=>`<button onclick="act('chow',${j})">吃 ${[c[0],last.t,c[1]].sort((x,y)=>x-y).map(NM2).join("")}</button>`).join("")+`<button onclick="act('pass')">過</button>`;
  }
  $("msg").textContent=m;$("act").innerHTML=a;
}
function pick(i){if(pend=="discard"&&!over)discard(0,i)}
const EM=["🧑","👧","👩","👦"],AVok=[0,0,0,0];
[0,1,2,3].forEach(p=>{const i=new Image();i.onload=()=>{AVok[p]=1;if(H)render()};i.src=`img/p${p}.jpg`});
const av=p=>AVok[p]?`<img class="av" src="img/p${p}.jpg" alt="">`:`<span class="av">${EM[p]}</span>`;
function rollDiceOld(){
  const o=document.createElement("div");o.id="shuf";
  o.innerHTML=`<div>擲骰子決定誰做莊</div><div id="dv" style="font-size:56px;letter-spacing:6px">⚀⚀⚀</div><div id="dres"></div><button id="db">擲骰子</button>`;
  $("t").appendChild(o);
  $("db").onclick=()=>{
    $("db").style.display="none";
    const f="⚀⚁⚂⚃⚄⚅",iv=setInterval(()=>{$("dv").textContent=[0,0,0].map(()=>f[Math.random()*6|0]).join("")},80);
    setTimeout(()=>{
      clearInterval(iv);
      const d=[0,0,0].map(()=>1+Math.random()*6|0),n=d[0]+d[1]+d[2];
      dealer=d0=(n-1)%4;
      $("dv").textContent=d.map(x=>f[x-1]).join("");
      $("dres").textContent=`點數 ${n}，從你開始逆時針數，由「${NMS[dealer]}」當莊`;
      $("db").textContent="開始洗牌";$("db").style.display="";
      $("db").onclick=()=>{o.remove();start()};
    },1200);
  };
}
const PIP=[0,[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const face=(el,v)=>{el.innerHTML=[0,1,2,3,4,5,6,7,8].map(i=>`<i class='${PIP[v].includes(i)?'on':''}'></i>`).join('');el.classList.toggle('r',v==1||v==4)};
function rollDice(){
  const o=document.createElement('div');o.id='shuf';
  o.innerHTML=`<div id='dbox'><h2>擲骰定莊</h2><p>三顆骰子，從你開始逆時針數</p><div id='dice'><div class='die'></div><div class='die'></div><div class='die'></div></div><div id='seats'><div class='seat' id='s2' style='grid-area:a'>${NMS[2]}</div><div class='seat' id='s3' style='grid-area:b'>${NMS[3]}</div><div id='sc'>?</div><div class='seat' id='s1' style='grid-area:d'>${NMS[1]}</div><div class='seat' id='s0' style='grid-area:e'>${NMS[0]}</div></div><div id='dres'>　</div><button id='db'>擲骰子</button></div>`;
  $('t').appendChild(o);
  const ds=[...document.querySelectorAll('.die')],rnd=()=>1+Math.random()*6|0;
  ds.forEach(d=>face(d,1));
  $('db').onclick=()=>{
    $('db').style.display='none';$('dres').textContent='';
    ds.forEach(d=>d.classList.add('rolling'));
    const iv=setInterval(()=>ds.forEach(d=>face(d,rnd())),90);
    setTimeout(()=>{
      clearInterval(iv);
      const v=ds.map(rnd),n=v[0]+v[1]+v[2];
      ds.forEach((d,i)=>{face(d,v[i]);d.classList.remove('rolling');d.classList.add('land')});
      $('sc').textContent=n;dealer=d0=(n-1)%4;
      let k=0;
      const cv=setInterval(()=>{
        document.querySelectorAll('.seat').forEach(s=>s.classList.remove('hot'));
        if(k>=n){clearInterval(cv);$('s'+dealer).classList.add('dealer');
          $('dres').textContent=`點數 ${n}，由「${NMS[dealer]}」當莊`;
          $('db').textContent='開始洗牌';$('db').style.display='';$('db').onclick=()=>{o.remove();start()};return}
        $('s'+(k%4)).classList.add('hot');k++;
      },Math.min(280,2600/n|0));
    },1300);
  };
}
rollDice();
</script></body></html>
